[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenbooth"
version = "0.0.1"
description = "Log in to a site in a locked-down browser window and print the token it leaves behind"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PySide6-Essentials>=6.8", "PySide6-WebEngine"]

[project.scripts]
tokenbooth = "tokenbooth.cli:main"

[tool.setuptools]
packages = ["tokenbooth"]

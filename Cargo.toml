[package]
name = "tokenbooth"
version = "0.1.0"
edition = "2024"
description = "Log in to a site in a locked-down browser and hand the token to an unlocked shell"
license = "Apache-2.0"
authors = ["Torstein Tauno Svendsen <torstei@gmail.com>"]
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
clap = { version = "4.6.7", features = ["derive", "env"] }
getrandom = "0.4.3"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
zeroize = "1.9.2"

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[package.metadata.deb]
extended-description = """\
A shell that pidvault has unlocked asks the daemon for a site's token. It answers from \
its sealed cache or opens a booth: Google Chrome as a fresh dynamic user, drawing on the \
caller's Wayland connection, limited to the site's hosts, that hands back the token and \
nothing else."""
changelog = "packaging/changelog.Debian"
section = "net"
copyright = "2026 Torstein Tauno Svendsen <torstei@gmail.com>"
depends = "$auto, python3, systemd (>= 257), pidvault (>= 0.6.0), google-chrome-stable"
assets = [
    ["target/release/tokenbooth", "usr/bin/", "755"],
    ["tokenbooth/__init__.py", "usr/lib/tokenbooth/tokenbooth/", "644"],
    ["tokenbooth/booth.py", "usr/lib/tokenbooth/tokenbooth/", "644"],
    ["tokenbooth/discover.py", "usr/lib/tokenbooth/tokenbooth/", "644"],
    ["tokenbooth/protocol.py", "usr/lib/tokenbooth/tokenbooth/", "644"],
    ["tokenbooth/store.py", "usr/lib/tokenbooth/tokenbooth/", "644"],
    ["tokenbooth/engines/__init__.py", "usr/lib/tokenbooth/tokenbooth/engines/", "644"],
    ["tokenbooth/engines/chrome.py", "usr/lib/tokenbooth/tokenbooth/engines/", "644"],
    # an asset, not a unit-script: cargo-deb would install the template without its @
    ["packaging/booth/tokenbooth-booth@.service", "usr/lib/systemd/system/", "644"],
    ["README.md", "usr/share/doc/tokenbooth/README.md", "644"],
]
maintainer-scripts = "packaging"
systemd-units = [
    { unit-scripts = "packaging", enable = true, start = true },
    { unit-scripts = "packaging/booth", unit-name = "tokenbooth-booth", enable = true, start = true },
]
